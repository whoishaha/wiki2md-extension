<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="documentTitle">wiki2md-extension</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="header-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="header-text">
          <span class="header-title">wiki2md-extension</span>
          <span class="header-subtitle" data-i18n="headerSubtitle">Zread / DeepWiki / Code Wiki / ReadMex 导出工具</span>
        </div>
      </div>
      <div class="lang-switcher" data-i18n-aria-label="langSwitcherLabel" aria-label="Language switcher">
        <button type="button" class="lang-btn active" data-lang="zh" aria-pressed="true">中</button>
        <span class="lang-divider">/</span>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">En</button>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="status status-info">
      <div class="status-dot"></div>
      <span id="statusText" data-i18n="statusReady">就绪，等待转换</span>
    </div>

    <!-- Main Content -->
    <div class="content">

      <!-- Single Convert Card -->
      <button id="convertBtn" class="action-card">
        <div class="action-card-icon action-card-icon-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="12" y2="12"/>
            <line x1="15" y1="15" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="action-card-text">
          <span class="action-card-title" data-i18n="convertSingleTitle">转换当前页面</span>
          <span class="action-card-desc" data-i18n="convertSingleDesc">将本文档导出为 Markdown 文件</span>
        </div>
        <div class="action-card-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </button>

      <!-- Batch Convert Card -->
      <button id="batchDownloadBtn" class="action-card">
        <div class="action-card-icon action-card-icon-secondary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
            <polyline points="7.5 9.5 12 12 16.5 9.5"/>
          </svg>
        </div>
        <div class="action-card-text">
          <span class="action-card-title" data-i18n="convertBatchTitle">批量导出所有章节</span>
          <span class="action-card-desc" data-i18n="convertBatchDesc">提取全部页面并打包为 ZIP</span>
        </div>
        <div class="action-card-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </button>

      <!-- Cancel Button -->
      <button id="cancelBtn" class="cancel-btn" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span data-i18n="cancelBatch">取消批量导出</span>
      </button>

      <!-- Batch Progress Card -->
      <div id="batchProgress" class="batch-progress" style="display: none;">
        <div class="batch-progress-header">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="batch-spinner">
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
          </svg>
          <span id="batchStatusTitle" data-i18n="batchProcessing">批量处理中...</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="batch-progress-stats">
          <span id="batchCurrent" data-i18n="batchPreparing">准备中</span>
          <span id="batchCount">0 / 0</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-text" data-i18n="footerText">支持 Zread、DeepWiki、Code Wiki 与 ReadMex</span>
      <span class="footer-divider">·</span>
      <span class="footer-version">v0.2.0</span>
      <span class="footer-divider">·</span>
        <a href="https://github.com/whoishaha/wiki2md-extension" target="_blank" rel="noopener noreferrer" class="footer-link" data-i18n-aria-label="githubAriaLabel" aria-label="GitHub Repository">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.699-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
